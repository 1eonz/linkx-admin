<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>警务协同系统 - 用户与权限管理</title>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- Element Plus JS -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    /* --- 核心色彩规范（方案 A） --- */
    :root {
      --bg-sidebar: #0f172a;
      --bg-header: #1e293b;
      --text-sidebar: #94a3b8;
      --text-sidebar-active: #ffffff;
      
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;
      
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      
      --text-title: #0f172a;
      --text-regular: #334155;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;

      --border-color: #e2e8f0;
      --border-color-dark: #334155;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06);
      --radius-base: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-regular); height: 100vh; overflow: hidden; }

    .app-layout { display: flex; height: 100vh; width: 100vw; }

    /* --- 左侧侧边栏 & 动态折叠动画 --- */
    .app-sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color-dark);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
      overflow: hidden;
    }

    .app-sidebar.is-collapsed {
      width: 64px;
    }

    .sidebar-logo {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--color-primary), #1d4ed8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      opacity: 1;
      transition: opacity 0.2s;
    }

    .app-sidebar.is-collapsed .logo-text {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-menu-wrapper { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0; }
    .el-menu { background-color: transparent !important; border-right: none !important; }
    
    .el-sub-menu__title, .el-menu-item {
      color: var(--text-sidebar) !important;
      height: 46px !important;
      line-height: 46px !important;
      margin: 4px 8px !important;
      border-radius: var(--radius-base) !important;
    }

    .el-sub-menu__title:hover, .el-menu-item:hover {
      background-color: rgba(255, 255, 255, 0.06) !important;
      color: var(--text-sidebar-active) !important;
    }

    .el-menu-item.is-active {
      background-color: var(--color-primary) !important;
      color: #ffffff !important;
      font-weight: 500;
    }

    /* --- 右侧主体区域 --- */
    .app-main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .app-header {
      height: 60px;
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    
    .toggle-collapse-btn {
      cursor: pointer;
      color: #94a3b8;
      font-size: 20px;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .toggle-collapse-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: #fff; }

    .header-breadcrumb .el-breadcrumb__inner { color: #94a3b8 !important; }
    .header-breadcrumb .el-breadcrumb__item:last-child .el-breadcrumb__inner { color: #ffffff !important; }

    .user-dropdown-link { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .user-dropdown-link:hover { background-color: rgba(255, 255, 255, 0.08); }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: rgba(37, 99, 235, 0.3); color: #60a5fa; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }

    /* --- 内容视口 --- */
    .app-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

    .modern-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-base);
      padding: 18px;
      box-shadow: var(--shadow-md);
    }

    /* 表格自定义组件样式 */
    .police-id {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--color-primary);
      background: var(--color-primary-light);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .el-table {
      --el-table-bg-color: #ffffff !important;
      --el-table-header-bg-color: #f1f5f9 !important;
      --el-table-border-color: var(--border-color) !important;
      --el-table-text-color: var(--text-regular) !important;
      --el-table-header-text-color: var(--text-title) !important;
      --el-table-row-hover-bg-color: #f8fafc !important;
    }

    .action-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-layout">
      
      <!-- 1. 左侧可折叠侧边栏 -->
      <aside :class="['app-sidebar', { 'is-collapsed': isCollapsed }]">
        <div class="sidebar-logo">
          <div class="logo-icon">P</div>
          <span class="logo-text">警务协同智能中枢</span>
        </div>

        <div class="sidebar-menu-wrapper">
          <el-menu
            :default-active="activeMenu"
            :collapse="isCollapsed"
            :collapse-transition="false"
            class="el-menu-vertical"
            @select="handleMenuSelect"
          >
            <el-sub-menu index="1">
              <template #title>
                <el-icon><cpu /></el-icon>
                <span>AI 智能体协同</span>
              </template>
              <el-menu-item index="1-1">智能体路由总控</el-menu-item>
              <el-menu-item index="1-2">推理置信度配置</el-menu-item>
            </el-sub-menu>

            <el-sub-menu index="2">
              <template #title>
                <el-icon><user-filled /></el-icon>
                <span>权限与用户管理</span>
              </template>
              <el-menu-item index="2-1">用户账号管理</el-menu-item>
              <el-menu-item index="2-2">角色矩阵配置</el-menu-item>
              <el-menu-item index="2-3">审计日志穿透</el-menu-item>
            </el-sub-menu>

            <el-menu-item index="3">
              <el-icon><setting /></el-icon>
              <template #title>全局参数配置</template>
            </el-menu-item>
          </el-menu>
        </div>
      </aside>

      <!-- 2. 右侧主体部分 -->
      <div class="app-main-wrapper">
        
        <!-- Header -->
        <header class="app-header">
          <div class="header-left">
            <!-- 展开/收起 按钮 -->
            <div class="toggle-collapse-btn" @click="isCollapsed = !isCollapsed" :title="isCollapsed ? '展开菜单' : '折叠菜单'">
              <el-icon><expand v-if="isCollapsed" /><fold v-else /></el-icon>
            </div>

            <div class="header-breadcrumb">
              <el-breadcrumb separator="/">
                <el-breadcrumb-item>权限与用户管理</el-breadcrumb-item>
                <el-breadcrumb-item>用户账号管理</el-breadcrumb-item>
              </el-breadcrumb>
            </div>
          </div>

          <!-- 用户头像 Dropdown -->
          <div class="header-user">
            <el-dropdown trigger="click">
              <div class="user-dropdown-link">
                <div class="user-avatar">警</div>
                <span style="color: #fff; font-size: 14px; font-weight: 500;">张警官</span>
                <el-icon style="color: #94a3b8;"><arrow-down /></el-icon>
              </div>
              <template #dropdown>
                <el-dropdown-menu>
                  <el-dropdown-item><el-icon><user /></el-icon> 个人资料</el-dropdown-item>
                  <el-dropdown-item divided style="color: var(--color-danger);"><el-icon><switch-button /></el-icon> 退出系统</el-dropdown-item>
                </el-dropdown-menu>
              </template>
            </el-dropdown>
          </div>
        </header>

        <!-- 纯白/浅色内容区 -->
        <main class="app-content">

          <!-- 1. 过滤搜索卡片 -->
          <div class="modern-card">
            <el-form :inline="true" :model="searchForm" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: -18px;">
              <el-form-item>
                <el-input v-model="searchForm.keyword" placeholder="搜索姓名 / 警号 / 手机号" style="width: 220px;" clearable>
                  <template #prefix><el-icon><search /></el-icon></template>
                </el-input>
              </el-form-item>
              
              <el-form-item>
                <el-select v-model="searchForm.role" placeholder="所属角色" style="width: 160px;" clearable>
                  <el-option label="系统管理员" value="admin" />
                  <el-option label="指挥员" value="commander" />
                  <el-option label="巡逻民警" value="patrol" />
                </el-select>
              </el-form-item>

              <el-form-item>
                <el-select v-model="searchForm.status" placeholder="账号状态" style="width: 130px;" clearable>
                  <el-option label="启用" :value="true" />
                  <el-option label="禁用" :value="false" />
                </el-select>
              </el-form-item>

              <el-form-item>
                <el-button type="primary" @click="handleSearch">查询</el-button>
                <el-button @click="resetSearch">重置</el-button>
              </el-form-item>

              <el-form-item style="margin-left: auto;">
                <el-button type="primary" @click="openAddUserModal">
                  <el-icon style="margin-right: 4px;"><plus /></el-icon> 新建警务用户
                </el-button>
              </el-form-item>
            </el-form>
          </div>

          <!-- 2. 用户数据列表 -->
          <div class="modern-card" style="flex: 1; display: flex; flex-direction: column;">
            <el-table :data="userList" style="width: 100%">
              <el-table-column prop="policeId" label="警号/账号" width="130">
                <template #default="{row}">
                  <span class="police-id">{{ row.policeId }}</span>
                </template>
              </el-table-column>

              <el-table-column prop="name" label="姓名" width="120">
                <template #default="{row}">
                  <span style="font-weight: 600; color: var(--text-title);">{{ row.name }}</span>
                </template>
              </el-table-column>

              <el-table-column prop="department" label="所属部门/科室" min-width="160" />

              <el-table-column prop="roles" label="分配角色" min-width="160">
                <template #default="{row}">
                  <el-tag v-for="r in row.roles" :key="r" size="small" style="margin-right: 4px;" effect="light">
                    {{ r }}
                  </el-tag>
                </template>
              </el-table-column>

              <el-table-column prop="phone" label="联系电话" width="140" />

              <!-- 状态切换开关 -->
              <el-table-column prop="enabled" label="账号状态" width="120">
                <template #default="{row}">
                  <el-switch
                    v-model="row.enabled"
                    active-text="启用"
                    inactive-text="禁用"
                    inline-prompt
                    @change="(val) => handleStatusChange(row, val)"
                  />
                </template>
              </el-table-column>

              <!-- 详细操作列 -->
              <el-table-column label="权限与账号操作" width="280" fixed="right">
                <template #default="{row}">
                  <div class="action-btn-group">
                    <el-button link type="primary" @click="openRoleModal(row)">设置角色</el-button>
                    <el-button link type="primary" @click="openPermissionDrawer(row)">配置权限</el-button>
                    <el-button link type="warning" @click="openPasswordModal(row)">修改密码</el-button>
                  </div>
                </template>
              </el-table-column>
            </el-table>

            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
              <el-pagination layout="total, prev, pager, next" :total="42" :page-size="10" />
            </div>
          </div>

        </main>
      </div>

      <!-- 3.1 弹窗：重置/修改密码 -->
      <el-dialog v-model="pwdModal.visible" :title="'重置密码 - ' + pwdModal.userName" width="420px" destroy-on-close>
        <el-form label-position="top">
          <el-form-item label="新密码">
            <el-input v-model="pwdModal.newPassword" show-password placeholder="请输入新密码">
              <template #append>
                <el-button @click="generateRandomPwd">随机生成</el-button>
              </template>
            </el-input>
          </el-form-item>
          <el-form-item label="确认新密码">
            <el-input v-model="pwdModal.confirmPassword" show-password placeholder="再次输入新密码" />
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="pwdModal.visible = false">取消</el-button>
          <el-button type="primary" @click="savePassword">确认修改</el-button>
        </template>
      </el-dialog>

      <!-- 3.2 弹窗：设置用户角色 -->
      <el-dialog v-model="roleModal.visible" :title="'分配角色 - ' + roleModal.userName" width="460px">
        <el-form label-position="top">
          <el-form-item label="勾选角色的权限集">
            <el-checkbox-group v-model="roleModal.selectedRoles" style="display: flex; flex-direction: column; gap: 8px;">
              <el-checkbox label="系统管理员">系统管理员 (全系统最高调度控制权)</el-checkbox>
              <el-checkbox label="指挥员">指挥员 (负责 AI 协同处置与警力分发)</el-checkbox>
              <el-checkbox label="巡逻民警">巡逻民警 (仅接收移动终端提示与反馈)</el-checkbox>
              <el-checkbox label="审计员">审计员 (只读日志与安全性穿透审查)</el-checkbox>
            </el-checkbox-group>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="roleModal.visible = false">取消</el-button>
          <el-button type="primary" @click="saveRoles">保存角色配置</el-button>
        </template>
      </el-dialog>

      <!-- 3.3 抽屉：细粒度权限配置 Tree -->
      <el-drawer v-model="permDrawer.visible" :title="'特权/个性化权限配置 - ' + permDrawer.userName" size="420px">
        <div style="margin-bottom: 16px; color: var(--text-secondary); font-size: 13px;">
          在此处配置该用户的独立功能节点权限（会覆盖角色默认权限）：
        </div>
        
        <el-tree
          :data="permissionTree"
          show-checkbox
          node-key="id"
          :default-checked-keys="permDrawer.checkedKeys"
          default-expand-all
        />

        <template #footer>
          <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <el-button @click="permDrawer.visible = false">取消</el-button>
            <el-button type="primary" @click="savePermissions">生效权限修改</el-button>
          </div>
        </template>
      </el-drawer>

    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    const app = createApp({
      setup() {
        // 左侧折叠控制状态
        const isCollapsed = ref(false);
        const activeMenu = ref('2-1');

        // 搜索栏
        const searchForm = ref({ keyword: '', role: '', status: null });

        // 用户列表 Mock 数据
        const userList = ref([
          { policeId: 'P001021', name: '张警官', department: '市局指挥中心', roles: ['指挥员', '系统管理员'], phone: '138****0011', enabled: true },
          { policeId: 'P001025', name: '李队长', department: '特警支队一大队', roles: ['指挥员'], phone: '139****2233', enabled: true },
          { policeId: 'P001089', name: '王警员', department: '交警支队网格巡查', roles: ['巡逻民警'], phone: '137****4455', enabled: true },
          { policeId: 'P002102', name: '赵专员', department: '网安支队审计科', roles: ['审计员'], phone: '135****8899', enabled: false },
        ]);

        // 修改密码 Modal
        const pwdModal = ref({ visible: false, userName: '', newPassword: '', confirmPassword: '' });
        const openPasswordModal = (row) => {
          pwdModal.value = { visible: true, userName: `${row.name} (${row.policeId})`, newPassword: '', confirmPassword: '' };
        };
        const generateRandomPwd = () => {
          pwdModal.value.newPassword = 'Pol@' + Math.random().toString(36).slice(-6);
        };
        const savePassword = () => {
          if (!pwdModal.value.newPassword) return ElementPlus.ElMessage.error('密码不能为空');
          ElementPlus.ElMessage.success('密码重置成功！');
          pwdModal.value.visible = false;
        };

        // 角色分配 Modal
        const roleModal = ref({ visible: false, userName: '', selectedRoles: [] });
        const openRoleModal = (row) => {
          roleModal.value = { visible: true, userName: row.name, selectedRoles: [...row.roles] };
        };
        const saveRoles = () => {
          ElementPlus.ElMessage.success('角色分配调整完成');
          roleModal.value.visible = false;
        };

        // 权限 Tree Drawer
        const permDrawer = ref({ visible: false, userName: '', checkedKeys: [11, 12, 21] });
        const permissionTree = [
          {
            id: 1, label: 'AI 智能体协同模块',
            children: [
              { id: 11, label: '查看智能体路由状态' },
              { id: 12, label: '修改置信度阈值' },
              { id: 13, label: '下线/重启智能体' },
            ]
          },
          {
            id: 2, label: '用户与安全模块',
            children: [
              { id: 21, label: '用户数据查看' },
              { id: 22, label: '账号启用/禁用权限' },
              { id: 23, label: '敏感数据密码重置' }
            ]
          }
        ];
        const openPermissionDrawer = (row) => {
          permDrawer.value.userName = row.name;
          permDrawer.value.visible = true;
        };
        const savePermissions = () => {
          ElementPlus.ElMessage.success('自定义节点权限配置更新成功');
          permDrawer.value.visible = false;
        };

        // 状态切换
        const handleStatusChange = (row, val) => {
          ElementPlus.ElMessage.info(`账号 [${row.name}] 状态调整为: ${val ? '启用' : '禁用'}`);
        };

        const handleSearch = () => { ElementPlus.ElMessage.success('查询刷新完成'); };
        const resetSearch = () => { searchForm.value = { keyword: '', role: '', status: null }; };
        const openAddUserModal = () => { ElementPlus.ElMessage.info('触发新建警务用户流程'); };
        const handleMenuSelect = (index) => { activeMenu.value = index; };

        return {
          isCollapsed, activeMenu, searchForm, userList,
          pwdModal, openPasswordModal, generateRandomPwd, savePassword,
          roleModal, openRoleModal, saveRoles,
          permDrawer, permissionTree, openPermissionDrawer, savePermissions,
          handleStatusChange, handleSearch, resetSearch, openAddUserModal, handleMenuSelect
        };
      }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
