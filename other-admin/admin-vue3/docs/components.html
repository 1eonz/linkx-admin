<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>警务协同系统 - 全量 UI 组件规范与完整交互原型</title>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- Element Plus JS -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. 核心视觉规范与全局变量
       ========================================================================== */
    :root {
      --bg-sidebar: #0f172a;
      --bg-header: #1e293b;
      --text-sidebar: #94a3b8;
      --text-sidebar-active: #ffffff;
      
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;
      
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-info: #64748b;
      
      --text-title: #0f172a;
      --text-regular: #334155;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;

      --border-color: #e2e8f0;
      --border-color-dark: #334155;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06);
      --radius-base: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-regular); height: 100vh; overflow: hidden; }

    .app-layout { display: flex; height: 100vh; width: 100vw; }

    /* ==========================================================================
       2. 侧边栏菜单样式
       ========================================================================== */
    .app-sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color-dark);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
      overflow: hidden;
    }
    .app-sidebar.is-collapsed { width: 64px; }

    .sidebar-logo {
      height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); white-space: nowrap;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--color-primary), #1d4ed8);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; flex-shrink: 0;
    }

    .logo-text { font-size: 15px; font-weight: 600; color: #ffffff; }
    .sidebar-menu-wrapper { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0; }
    .el-menu { background-color: transparent !important; border-right: none !important; }
    
    .el-sub-menu__title, .el-menu-item {
      color: var(--text-sidebar) !important;
      height: 46px !important; line-height: 46px !important;
      margin: 4px 8px !important; border-radius: var(--radius-base) !important;
    }

    .el-sub-menu__title:hover, .el-menu-item:hover {
      background-color: rgba(255, 255, 255, 0.06) !important;
      color: var(--text-sidebar-active) !important;
    }

    .el-menu-item.is-active {
      background-color: var(--color-primary) !important;
      color: #ffffff !important; font-weight: 500;
    }

    /* ==========================================================================
       3. 顶部 Header 与内容视口
       ========================================================================== */
    .app-main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .app-header {
      height: 60px; background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color-dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    .toggle-collapse-btn { cursor: pointer; color: #94a3b8; font-size: 20px; display: flex; align-items: center; padding: 6px; border-radius: 6px; transition: all 0.2s; }
    .toggle-collapse-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: #fff; }

    .header-breadcrumb .el-breadcrumb__inner { color: #94a3b8 !important; }
    .header-breadcrumb .el-breadcrumb__item:last-child .el-breadcrumb__inner { color: #ffffff !important; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: rgba(37, 99, 235, 0.3); color: #60a5fa; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }

    .app-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

    .modern-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-base);
      padding: 20px; box-shadow: var(--shadow-md);
    }

    .showcase-section { margin-bottom: 24px; }
    .showcase-section:last-child { margin-bottom: 0; }
    
    .section-title {
      font-size: 16px; font-weight: 600; color: var(--text-title);
      padding-bottom: 10px; border-bottom: 1px dashed var(--border-color);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }

    .component-group { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
    .component-label { font-size: 13px; color: var(--text-secondary); width: 140px; font-weight: 500; }

    .police-id {
      font-family: 'JetBrains Mono', monospace; font-weight: 600;
      color: var(--color-primary); background: var(--color-primary-light);
      padding: 2px 6px; border-radius: 4px;
    }

    /* ==========================================================================
       4. 特性业务组件 CSS 样式
       ========================================================================== */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .metric-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--border-color); border-radius: 8px; padding: 16px;
    }
    .metric-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .metric-value { font-size: 24px; font-weight: 700; color: var(--text-title); font-family: 'JetBrains Mono', monospace; }
    .metric-footer { font-size: 12px; margin-top: 8px; color: var(--text-muted); }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; position: relative; }
    .status-dot.online { background-color: var(--color-success); }
    .status-dot.online::after {
      content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background-color: var(--color-success); opacity: 0.6; animation: pulse 1.6s infinite ease-in-out;
    }
    .status-dot.busy { background-color: var(--color-warning); }
    .status-dot.offline { background-color: var(--color-info); }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.8); opacity: 0; } }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .personnel-card {
      border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; background: #fff;
      display: flex; gap: 12px; align-items: center; transition: all 0.2s;
    }
    .personnel-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Vue 核心 HTML 模板 -->
  <script type="text/template" id="app-template">
    <div class="app-layout">
      
      <!-- 侧边栏导航 -->
      <aside :class="['app-sidebar', { 'is-collapsed': isCollapsed }]">
        <div class="sidebar-logo">
          <div class="logo-icon">P</div>
          <span class="logo-text">警务协同智能中枢</span>
        </div>

        <div class="sidebar-menu-wrapper">
          <el-menu :default-active="activeMenu" :collapse="isCollapsed" :collapse-transition="false" @select="handleMenuSelect">
            <el-menu-item index="3-1">
              <el-icon><menu></menu></el-icon>
              <template #title>全量 UI 组件规范总览</template>
            </el-menu-item>
            <el-menu-item index="2-1">
              <el-icon><user-filled></user-filled></el-icon>
              <template #title>用户与权限管理（实战页面）</template>
            </el-menu-item>
          </el-menu>
        </div>
      </aside>

      <!-- 主体结构 -->
      <div class="app-main-wrapper">
        <header class="app-header">
          <div class="header-left">
            <div class="toggle-collapse-btn" @click="isCollapsed = !isCollapsed">
              <el-icon><expand v-if="isCollapsed"></expand><fold v-else></fold></el-icon>
            </div>
            <div class="header-breadcrumb">
              <el-breadcrumb separator="/">
                <el-breadcrumb-item>警务系统设计规范</el-breadcrumb-item>
                <el-breadcrumb-item>{{ activeMenu === '3-1' ? '全量 UI 组件规范总览' : '用户与权限管理（实战页面）' }}</el-breadcrumb-item>
              </el-breadcrumb>
            </div>
          </div>
          <div class="user-avatar">警</div>
        </header>

        <!-- 内容视口区域 -->
        <main class="app-content">

          <!-- ===================================================================
               页面 1：全量 UI 组件规范总览
               =================================================================== -->
          <div v-if="activeMenu === '3-1'" style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- 1. 警务指标数据卡片 -->
            <div class="modern-card">
              <div class="section-title">
                <el-icon color="#2563eb"><data-analysis></data-analysis></el-icon>
                1. 警务数据与指标统计卡片（Metric Cards）
              </div>
              <div class="metric-grid">
                <div class="metric-card">
                  <div class="metric-title">今日高危告警 <el-tag size="small" type="danger">紧急</el-tag></div>
                  <div class="metric-value" style="color: var(--color-danger);">142</div>
                  <div class="metric-footer">较昨日 <span style="color:var(--color-danger)">↑ 12%</span> | 自动出警 110 起</div>
                </div>
                <div class="metric-card">
                  <div class="metric-title">在线警力/装备 <el-tag size="small" type="success">实时</el-tag></div>
                  <div class="metric-value">1,280</div>
                  <div class="metric-footer">巡逻车 320 辆 | 执勤警员 960 人</div>
                </div>
                <div class="metric-card">
                  <div class="metric-title">AI 推理引擎负载</div>
                  <div class="metric-value">42.8%</div>
                  <div class="metric-footer">平均响应延迟 <span style="color:var(--color-success)">↓ 14ms</span></div>
                </div>
                <div class="metric-card">
                  <div class="metric-title">协同指令闭环率</div>
                  <div class="metric-value">98.5%</div>
                  <div class="metric-footer">本周已归档案件 450 起</div>
                </div>
              </div>
            </div>

            <!-- 2. 状态标签、呼吸灯徽章与通知 Alert -->
            <div class="modern-card">
              <div class="section-title">
                <el-icon color="#2563eb"><bell></bell></el-icon>
                2. 状态标签、呼吸灯徽章与通知 Banner
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <el-alert title="重大警情插播：市中心三号路口触发一级车辆碰撞告警，已自动通知最近巡逻车。" type="warning" show-icon :closable="false" />
                <el-alert title="AI 模型优化完成：人像识别特征库升级至 v4.2 版本，精准度提升 3.5%。" type="success" show-icon />
              </div>

              <div class="component-group">
                <span class="component-label">实时状态呼吸灯：</span>
                <span style="display: inline-flex; align-items: center; font-size: 13px; margin-right: 16px;"><span class="status-dot online"></span> 在线/正常</span>
                <span style="display: inline-flex; align-items: center; font-size: 13px; margin-right: 16px;"><span class="status-dot busy"></span> 处置中/忙碌</span>
                <span style="display: inline-flex; align-items: center; font-size: 13px;"><span class="status-dot offline"></span> 离线/异常</span>
              </div>

              <div class="component-group" style="margin-top: 12px;">
                <span class="component-label">业务 Tag 徽章：</span>
                <el-tag type="primary" effect="dark">一级勤务</el-tag>
                <el-tag type="success" effect="light">人脸识别匹配</el-tag>
                <el-tag type="warning" effect="plain">待核验</el-tag>
                <el-tag type="danger" round>高危涉案人员</el-tag>
                <el-tag type="info">已归档</el-tag>
              </div>
            </div>

            <!-- 3. 统一按钮与操作列规范 -->
            <div class="modern-card">
              <div class="section-title">
                <el-icon color="#2563eb"><operation></operation></el-icon>
                3. 统一按钮规范（图标 + 文字）
              </div>

              <div class="showcase-section">
                <div style="font-size: 13px; font-weight: 600; color: var(--text-title); margin-bottom: 10px;">检索与全局工具动作按钮：</div>
                <div class="component-group">
                  <el-button type="primary"><el-icon style="margin-right:4px;"><search></search></el-icon>查询搜索</el-button>
                  <el-button><el-icon style="margin-right:4px;"><refresh-right></refresh-right></el-icon>重置条件</el-button>
                  <el-button type="primary"><el-icon style="margin-right:4px;"><plus></plus></el-icon>新增数据</el-button>
                  <el-button type="warning"><el-icon style="margin-right:4px;"><edit></edit></el-icon>批量编辑</el-button>
                  <el-button type="danger"><el-icon style="margin-right:4px;"><delete></delete></el-icon>批量删除</el-button>
                  <el-button type="success"><el-icon style="margin-right:4px;"><download></download></el-icon>导出数据</el-button>
                </div>
              </div>

              <div class="showcase-section" style="margin-top: 16px;">
                <div style="font-size: 13px; font-weight: 600; color: var(--text-title); margin-bottom: 10px;">表格行内操作列按钮规范（Action Buttons）：</div>
                <div class="component-group">
                  <el-button link type="primary"><el-icon style="margin-right:2px;"><view></view></el-icon>查看</el-button>
                  <el-button link type="primary"><el-icon style="margin-right:2px;"><edit></edit></el-icon>编辑</el-button>
                  <el-button link type="warning"><el-icon style="margin-right:2px;"><video-pause></video-pause></el-icon>禁用</el-button>
                  <el-button link type="success"><el-icon style="margin-right:2px;"><video-play></video-play></el-icon>启用</el-button>
                  <el-button link type="danger"><el-icon style="margin-right:2px;"><delete></delete></el-icon>删除</el-button>
                </div>
              </div>
            </div>

            <!-- 4. 统一表单与级联输入控件 -->
            <div class="modern-card">
              <div class="section-title">
                <el-icon color="#2563eb"><edit-pen></edit-pen></el-icon>
                4. 统一表单、级联机构与输入控件
              </div>

              <el-form label-width="130px" style="max-width: 880px;">
                <el-form-item label="所属机构/辖区">
                  <el-cascader :options="deptCascaderOptions" placeholder="级联选择 市局 / 分局 / 派出所" style="width: 360px;" clearable />
                </el-form-item>

                <el-form-item label="搜索关键字框">
                  <el-input v-model="demoForm.keyword" placeholder="输入关键字..." clearable style="width: 360px;">
                    <template #prefix><el-icon><search></search></el-icon></template>
                  </el-input>
                </el-form-item>

                <el-form-item label="下拉选择框">
                  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <el-select v-model="demoForm.singleSelect" placeholder="单选下拉框" style="width: 200px;" clearable>
                      <el-option label="市公安局" value="1"></el-option>
                      <el-option label="交警支队" value="2"></el-option>
                      <el-option label="巡特警支队" value="3"></el-option>
                    </el-select>

                    <el-select v-model="demoForm.multiSelect" multiple collapse-tags placeholder="多选 Tag 模式" style="width: 260px;">
                      <el-option label="人像卡口识别" value="v1"></el-option>
                      <el-option label="车辆轨迹重构" value="v2"></el-option>
                      <el-option label="警力智能调度" value="v3"></el-option>
                    </el-select>
                  </div>
                </el-form-item>

                <el-form-item label="时间与日期选择">
                  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <el-date-picker v-model="demoForm.datePoint" type="datetime" placeholder="选择时间点" style="width: 220px;"></el-date-picker>
                    <el-date-picker v-model="demoForm.dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" style="width: 320px;"></el-date-picker>
                  </div>
                </el-form-item>

                <el-form-item label="拖拽证据上传">
                  <el-upload action="#" drag multiple style="width: 100%;">
                    <el-icon class="el-icon--upload"><upload-filled /></el-icon>
                    <div class="el-upload__text">将现场照片/视频/文档拖到此处，或 <em>点击上传</em></div>
                  </el-upload>
                </el-form-item>
              </el-form>
            </div>

            <!-- 5. 抓拍图集网格与放大预览 -->
            <div class="modern-card">
              <div class="section-title">
                <el-icon color="#2563eb"><picture></picture></el-icon>
                5. 抓拍图集与人像预览（支持点击放大）
              </div>
              <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                <div v-for="(img, idx) in captureImages" :key="idx" style="width: 140px; text-align: center;">
                  <el-image
                    style="width: 140px; height: 100px; border-radius: 6px; border: 1px solid var(--border-color);"
                    :src="img.url"
                    :preview-src-list="captureImages.map(i => i.url)"
                    fit="cover"
                  />
                  <span style="font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: block;">{{ img.time }}</span>
                </div>
              </div>
            </div>

            <!-- 6. 警务人员/装备卡片网格 -->
            <div class="modern-card">
              <div class="section-title">
                <el-icon color="#2563eb"><user></user></el-icon>
                6. 在勤人员/装备网格卡片 (Personnel Grid)
              </div>
              <div class="card-grid">
                <div class="personnel-card" v-for="p in personnelList" :key="p.id">
                  <div class="user-avatar" style="width:44px; height:44px; font-size:16px;">{{ p.name[0] }}</div>
                  <div style="flex:1;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <b style="font-size: 14px; color: var(--text-title);">{{ p.name }}</b>
                      <span :class="['status-dot', p.status]"></span>
                    </div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">警号: {{ p.policeId }}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">{{ p.dept }}</div>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- ===================================================================
               页面 2：用户与权限管理（包含增删改查完整交互）
               =================================================================== -->
          <div v-else-if="activeMenu === '2-1'" style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- 检索卡片 -->
            <div class="modern-card">
              <el-form :inline="true" :model="userSearchForm" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: -18px;">
                <el-form-item>
                  <el-input v-model="userSearchForm.keyword" placeholder="输入搜索姓名 / 警号" style="width: 220px;" clearable>
                    <template #prefix><el-icon><search></search></el-icon></template>
                  </el-input>
                </el-form-item>
                <el-form-item>
                  <el-select v-model="userSearchForm.department" placeholder="选择所属部门" style="width: 180px;" clearable>
                    <el-option label="市局指挥中心" value="指挥中心"></el-option>
                    <el-option label="交警支队" value="交警支队"></el-option>
                    <el-option label="特警支队" value="特警支队"></el-option>
                  </el-select>
                </el-form-item>
                <el-form-item>
                  <el-button type="primary" @click="handleUserSearch"><el-icon style="margin-right: 4px;"><search></search></el-icon>查询</el-button>
                  <el-button @click="resetUserSearch"><el-icon style="margin-right: 4px;"><refresh-right></refresh-right></el-icon>重置</el-button>
                </el-form-item>
              </el-form>
            </div>

            <!-- 数据表格卡片 -->
            <div class="modern-card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div style="display: flex; gap: 10px;">
                  <el-button type="primary" @click="openUserModal()"><el-icon style="margin-right: 4px;"><plus></plus></el-icon>新增警员账号</el-button>
                  <el-button type="danger" :disabled="selectedUserRows.length === 0" @click="batchDeleteUsers"><el-icon style="margin-right: 4px;"><delete></delete></el-icon>批量删除</el-button>
                </div>
                <div style="font-size: 13px; color: var(--text-secondary);">
                  已选择 <b style="color: var(--color-primary);">{{ selectedUserRows.length }}</b> 项
                </div>
              </div>

              <el-table :data="filteredUserList" style="width: 100%" @selection-change="handleUserSelectionChange">
                <el-table-column type="selection" width="50"></el-table-column>
                <el-table-column prop="policeId" label="警号" width="130">
                  <template #default="{row}"><span class="police-id">{{ row.policeId }}</span></template>
                </el-table-column>
                <el-table-column prop="name" label="姓名" width="120"></el-table-column>
                <el-table-column prop="department" label="所属部门"></el-table-column>
                <el-table-column prop="roles" label="分配角色">
                  <template #default="{row}">
                    <el-tag v-for="r in row.roles" :key="r" size="small" style="margin-right: 4px;" type="primary">{{ r }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="status" label="状态" width="100">
                  <template #default="{row}">
                    <el-tag :type="row.status === '正常' ? 'success' : 'info'" size="small">{{ row.status }}</el-tag>
                  </template>
                </el-table-column>
                <el-table-column label="操作" width="220" fixed="right">
                  <template #default="{row}">
                    <el-button link type="primary" @click="openUserModal(row)"><el-icon style="margin-right: 2px;"><edit></edit></el-icon>编辑</el-button>
                    <el-button link type="warning" @click="toggleUserStatus(row)">
                      <el-icon style="margin-right: 2px;"><lock></lock></el-icon>{{ row.status === '正常' ? '禁用' : '启用' }}
                    </el-button>
                    <el-button link type="danger" @click="deleteUser(row)"><el-icon style="margin-right: 2px;"><delete></delete></el-icon>删除</el-button>
                  </template>
                </el-table-column>
              </el-table>

              <!-- 分页器 -->
              <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
                <el-pagination background layout="prev, pager, next, total" :total="filteredUserList.length" :page-size="5" />
              </div>
            </div>

          </div>

        </main>
      </div>

      <!-- ===================================================================
           弹窗：警员新增/修改 Modal
           =================================================================== -->
      <el-dialog v-model="userModalVisible" :title="isEditUser ? '编辑警员账号' : '新增警员账号'" width="500px">
        <el-form :model="userForm" label-width="100px">
          <el-form-item label="警号">
            <el-input v-model="userForm.policeId" placeholder="例: P001099" :disabled="isEditUser" />
          </el-form-item>
          <el-form-item label="姓名">
            <el-input v-model="userForm.name" placeholder="请输入警员姓名" />
          </el-form-item>
          <el-form-item label="所属部门">
            <el-select v-model="userForm.department" placeholder="请选择部门" style="width: 100%;">
              <el-option label="市局指挥中心" value="市局指挥中心"></el-option>
              <el-option label="交警支队" value="交警支队"></el-option>
              <el-option label="特警支队" value="特警支队"></el-option>
              <el-option label="石羊派出所" value="石羊派出所"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="分配角色">
            <el-select v-model="userForm.roles" multiple placeholder="请选择角色" style="width: 100%;">
              <el-option label="系统管理员" value="系统管理员"></el-option>
              <el-option label="指挥员" value="指挥员"></el-option>
              <el-option label="巡逻警员" value="巡逻警员"></el-option>
            </el-select>
          </el-form-item>
        </el-form>
        <template #footer>
          <span class="dialog-footer">
            <el-button @click="userModalVisible = false">取消</el-button>
            <el-button type="primary" @click="saveUser">保存确定</el-button>
          </span>
        </template>
      </el-dialog>

    </div>
  </script>

  <script>
    const { createApp, ref, computed } = Vue;

    const app = createApp({
      template: '#app-template',
      setup() {
        const isCollapsed = ref(false);
        const activeMenu = ref('3-1');

        // 表单演示数据
        const demoForm = ref({
          keyword: '', singleSelect: '', multiSelect: [],
          datePoint: '', dateRange: [], numberValue: 85, textareaValue: ''
        });

        // 机构级联数据
        const deptCascaderOptions = ref([
          {
            value: 'chengdu', label: '成都市公安局',
            children: [
              {
                value: 'gaoxin', label: '高新区分局',
                children: [
                  { value: 'p1', label: '和平派出所' },
                  { value: 'p2', label: '石羊派出所' }
                ]
              }
            ]
          }
        ]);

        // 图集与人员卡片数据
        const captureImages = ref([
          { url: 'https://picsum.photos/300/200?random=1', time: '10:42:01 抓拍' },
          { url: 'https://picsum.photos/300/200?random=2', time: '10:43:18 抓拍' },
          { url: 'https://picsum.photos/300/200?random=3', time: '10:45:00 抓拍' }
        ]);

        const personnelList = ref([
          { id: 1, name: '王巡警', policeId: 'P008101', dept: '交警二大队', status: 'online' },
          { id: 2, name: '李队员', policeId: 'P008105', dept: '巡特警三中队', status: 'busy' },
          { id: 3, name: '陈警长', policeId: 'P008210', dept: '石羊派出所', status: 'offline' }
        ]);

        // ==========================================
        // 实战页面：用户与权限管理逻辑
        // ==========================================
        const userSearchForm = ref({ keyword: '', department: '' });
        const selectedUserRows = ref([]);
        const userModalVisible = ref(false);
        const isEditUser = ref(false);

        const userForm = ref({ policeId: '', name: '', department: '', roles: [] });

        const rawUserList = ref([
          { policeId: 'P001021', name: '张警官', department: '市局指挥中心', roles: ['指挥员'], status: '正常' },
          { policeId: 'P001025', name: '李队长', department: '特警支队', roles: ['系统管理员', '指挥员'], status: '正常' },
          { policeId: 'P001030', name: '王警员', department: '交警支队', roles: ['巡逻警员'], status: '禁用' }
        ]);

        const filteredUserList = computed(() => {
          return rawUserList.value.filter(user => {
            const matchKw = !userSearchForm.value.keyword || 
              user.name.includes(userSearchForm.value.keyword) || 
              user.policeId.includes(userSearchForm.value.keyword);
            const matchDept = !userSearchForm.value.department || user.department === userSearchForm.value.department;
            return matchKw && matchDept;
          });
        });

        const handleUserSearch = () => { ElementPlus.ElMessage.success('已刷新检索列表'); };
        const resetUserSearch = () => { userSearchForm.value = { keyword: '', department: '' }; };
        const handleUserSelectionChange = (val) => { selectedUserRows.value = val; };

        const openUserModal = (row = null) => {
          if (row) {
            isEditUser.value = true;
            userForm.value = JSON.parse(JSON.stringify(row));
          } else {
            isEditUser.value = false;
            userForm.value = { policeId: 'P00' + Math.floor(Math.random() * 8999 + 1000), name: '', department: '', roles: [] };
          }
          userModalVisible.value = true;
        };

        const saveUser = () => {
          if (!userForm.value.name) return ElementPlus.ElMessage.warning('请输入警员姓名');
          if (isEditUser.value) {
            const idx = rawUserList.value.findIndex(u => u.policeId === userForm.value.policeId);
            if (idx !== -1) rawUserList.value[idx] = { ...userForm.value };
            ElementPlus.ElMessage.success('编辑账号成功');
          } else {
            rawUserList.value.unshift({ ...userForm.value, status: '正常' });
            ElementPlus.ElMessage.success('新增账号成功');
          }
          userModalVisible.value = false;
        };

        const toggleUserStatus = (row) => {
          row.status = row.status === '正常' ? '禁用' : '正常';
          ElementPlus.ElMessage.info(`已切换 ${row.name} 状态为：${row.status}`);
        };

        const deleteUser = (row) => {
          rawUserList.value = rawUserList.value.filter(u => u.policeId !== row.policeId);
          ElementPlus.ElMessage.success(`已成功删除警员 ${row.name}`);
        };

        const batchDeleteUsers = () => {
          const ids = selectedUserRows.value.map(u => u.policeId);
          rawUserList.value = rawUserList.value.filter(u => !ids.includes(u.policeId));
          ElementPlus.ElMessage.success(`已批量删除 ${ids.length} 个账号`);
        };

        const handleMenuSelect = (index) => { activeMenu.value = index; };

        return {
          isCollapsed, activeMenu, demoForm, deptCascaderOptions, captureImages, personnelList,
          userSearchForm, filteredUserList, selectedUserRows, userModalVisible, isEditUser, userForm,
          handleUserSearch, resetUserSearch, handleUserSelectionChange, openUserModal, saveUser,
          toggleUserStatus, deleteUser, batchDeleteUsers, handleMenuSelect
        };
      }
    });

    // 注册 Element Plus 图标
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
