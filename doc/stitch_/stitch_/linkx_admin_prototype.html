    function flat(){return routes.flatMap(r=>r.children||[r])}function norm(p){return p==='/login'||flat().some(x=>x.path===p)?p:'/dashboard'}function find(p){for(const g of routes){if(g.path===p&&!g.children)return{g};const c=g.children&&g.children.find(x=>x.path===p);if(c)return{g,c}}return{g:routes[0]}}

    function sideHtml(){return`<div class="logo"><span class="logo-mark">L</span><span class="txt">警务协同</span></div><div class="scroll"><ul class="menu">${routes.map(g=>{const active=state.route===g.path||g.children?.some(c=>c.path===state.route);if(!g.children)return`<li><button class="menu-btn ${active?'active':''}" data-route="${g.path}"><span class="icon">${g.icon}</span><span class="txt">${g.title}</span></button></li>`;return`<li class="${active?'':'closed'}"><button class="menu-btn" data-group><span class="icon">${g.icon}</span><span class="txt">${g.title}</span><span class="caret">›</span></button><ul class="sub">${g.children.map(c=>`<li><button class="menu-btn ${state.route===c.path?'active':''}" data-route="${c.path}"><span class="txt">${c.title}</span></button></li>`).join('')}</ul></li>`}).join('')}</ul></div>`}
    function navHtml(cur){const title=cur.c?cur.c.title:cur.g.title;const crumb=cur.c?`<span>${cur.g.title}</span><span>/</span><strong>${title}</strong>`:`<strong>${title}</strong>`;return`<header class="navbar"><button class="hamb" data-act="toggle" aria-label="折叠侧栏"><span></span></button><nav class="crumb">${crumb}</nav><div class="avatar"><button class="avatar-btn" data-act="drop"><span class="avatar-icon">人</span><span>admin</span></button><div class="drop ${state.drop?'':'hidden'}"><button data-route="/dashboard">首页</button><button data-act="password">修改密码</button><button data-act="bind">绑定警员</button><button data-act="logout">退出</button></div></div><div class="tip">修改数据后，请重新登录客户端</div></header>`}
    function pageHtml(){if(state.route==='/dashboard')return`<div class="dashboard"><h1>欢迎使用${systemTitle}后台管理系统</h1><div class="version"><div class="version-trigger"><img src="${versionIcon}" alt="" width="18" height="18"><span>版本信息</span></div><div class="version-pop"><div>警务协同版本：V2.8.0</div><div>MSIP版本：V5.6.2</div><div>警信版本：V3.4.1</div></div></div></div>`;const p=pages[state.route]||cfg('页面',[],['名称','状态'],[['暂无数据','正常']],['新增']);if(p.globals)return`<div class="card">${globalsPage(p)}</div>`;if(p.tabs){const active=state.tabs[state.route]||p.tabs[0].name;const cur=p.tabs.find(x=>x.name===active)||p.tabs[0];return`<div class="card"><div class="tabs"><div class="tab-head">${p.tabs.map(t=>`<button class="tab ${t.name===active?'active':''}" data-tab="${t.name}">${t.name}</button>`).join('')}</div><div class="tab-body">${region(cur)}</div></div></div>`}return`<div class="card">${region(p)}</div>`}
    function globalsPage(p){const rows=globalsRows(p),chips=globalsChips(p);return`<div class="filters"><input class="el-input" style="width:360px" placeholder="请输入配置项 / 参数名 / 备注 进行搜索"><button class="el-btn primary" data-page="search">搜索</button><button class="el-btn" data-page="reset">重置</button><button class="el-btn primary" data-row-action="新增">新增</button></div><div class="chips">${chips.map(c=>`<button class="chip ${state.globalClassify===c.key?'active':''}" data-classify="${c.key}"><span>${c.label}</span><span class="chip-count">${c.count}</span></button>`).join('')}</div>${globalsTable(rows,p)}${rows.length?pager({rows}):'<div style="padding:48px 0;text-align:center;color:#909399">未找到匹配的配置项</div>'}`}
    function globalsRows(p){return state.globalClassify==='__ALL__'?p.rows:p.rows.filter(r=>(r.classify||'未分类')===state.globalClassify)}
    function globalsChips(p){const map={};p.rows.forEach(r=>{const k=r.classify||'未分类';map[k]=(map[k]||0)+1});return[{key:'__ALL__',label:'全部',count:p.rows.length},...Object.keys(map).map(k=>({key:k,label:k,count:map[k]}))]}
    function globalsIndex(rows,row,i){const keys=[];rows.forEach(r=>{const k=r.classify||'未分类';if(!keys.includes(k))keys.push(k)});let n=1;for(let x=0;x<i;x++)if((rows[x].classify||'未分类')===(row.classify||'未分类'))n++;return`${keys.indexOf(row.classify||'未分类')+1}.${n}`}
    function globalsTable(rows,p){return`<div class="table-wrap"><table><thead><tr><th style="width:180px;text-align:center">类别</th><th style="width:80px;text-align:center">序号</th><th>配置项</th><th>参数名</th><th>配置值</th><th>备注</th><th>状态</th><th style="width:180px">操作</th></tr></thead><tbody>${rows.map((r,i)=>{const first=i===0||(rows[i-1].classify||'未分类')!==(r.classify||'未分类');const span=first?rows.slice(i).findIndex((x,idx)=>idx>0&&(x.classify||'未分类')!==(r.classify||'未分类')):-1;const rowSpan=span===-1?rows.length-i:span;return`<tr>${first?`<td class="classify-cell" rowspan="${rowSpan}"><div class="classify-block"><span class="classify-name">${esc(r.classify||'未分类')}</span><span class="tag">${p.rows.filter(x=>(x.classify||'未分类')===(r.classify||'未分类')).length}</span></div></td>`:''}<td class="index-cell"><span class="index-text">${globalsIndex(rows,r,i)}</span></td><td>${esc(r.remarkEn)}</td><td>${esc(r.name)}</td><td><span class="config-value">${esc(r.value)}</span></td><td>${esc(r.remark)}</td><td>${r.status===0?'<span class="tag ok">正常</span>':'<span class="tag bad">禁用</span>'}</td><td><button class="el-btn primary" data-row-action="编辑" data-row="${i}">编辑</button> ${r.status===0?`<button class="el-btn danger" data-row-action="删除" data-row="${i}">删除</button>`:`<button class="el-btn" data-row-action="恢复" data-row="${i}">恢复</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
    function region(c){const body=`${filters(c)}${table(c)}${pager(c)}`;return c.tree?`<div class="split">${treeHtml()}<div>${body}</div></div>`:body}
    function filters(c){const bulk=c.actions.includes('批量删除');return`<div class="filters">${(c.filters||[]).map(input).join('')}<button class="el-btn primary" data-page="search">搜索</button><button class="el-btn primary" data-page="reset">重置</button>${createBtn(c.actions)}${bulk?'<button class="el-btn danger" data-row-action="批量删除">批量删除</button>':''}<span class="note">当前为本地模拟数据，路由与功能入口按真实项目完整展示</span></div>`}
    function input(label){return label.includes('类型')?`<select class="el-select" aria-label="${label}"><option>${label}</option><option>组织</option><option>用户</option><option>应用</option></select>`:`<input class="el-input" aria-label="${label}" placeholder="${label}">`}
    function createBtn(actions){const a=actions.find(x=>['新增','上传底图','新增组织','新增板块','批量排班','上传','批量授权'].includes(x));return a?`<button class="el-btn primary" data-row-action="${a}">${a}</button>`:''}
    function treeHtml(){return`<aside class="tree"><div class="tree-title">组织树</div>${tree.map((n,i)=>`<button class="tree-node l${Math.min(i,2)} ${state.tree===n?'active':''}" data-tree="${n}">${i?'└':'▾'} ${n}</button>`).join('')}</aside>`}
    function table(c){const acts=c.actions.filter(x=>!['新增','上传底图','新增组织','新增板块','批量排班','上传','批量删除','批量授权'].includes(x));return`<div class="table-wrap"><table><thead><tr>${c.selection?'<th style="width:48px"><input type="checkbox" aria-label="全选"></th>':''}<th style="width:70px">序号</th>${c.cols.map(x=>`<th>${x}</th>`).join('')}<th style="width:${Math.max(140,acts.length*72)}px">操作</th></tr></thead><tbody>${c.rows.map((r,i)=>`<tr>${c.selection?'<td><input type="checkbox" aria-label="选择行"></td>':''}<td>${i+1}</td>${r.map(cell=>`<td>${cellHtml(cell)}</td>`).join('')}<td>${acts.map(a=>`<button class="el-btn text-btn ${a.includes('删除')||a==='拒绝'?'text-danger':''}" data-row-action="${a}" data-row="${i}">${a}</button>`).join('')}</td></tr>`).join('')}</tbody></table></div>`}
    function cellHtml(v){const s=String(v);if(['启用','显示','在线','成功','已授权','已绑定','正常'].includes(s))return`<span class="tag ok">${s}</span>`;if(['停用','离线','失败','未授权','未绑定'].includes(s))return`<span class="tag bad">${s}</span>`;if(['处理中','待授权'].includes(s))return`<span class="tag warn">${s}</span>`;if(s.startsWith('#'))return`<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:18px;height:18px;border-radius:3px;background:${s};display:inline-block"></span>${s}</span>`;return esc(s)}
    function pager(c){return`<div class="pager"><span>共 ${c.rows.length*18} 条</span><select class="el-select" style="min-width:100px;height:32px"><option>10条/页</option><option>20条/页</option></select><button class="p" data-page="prev">‹</button><button class="p active">1</button><button class="p" data-page="next">2</button><button class="p" data-page="next">›</button></div>`}
    function bindShell(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.route)});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>b.closest('li').classList.toggle('closed'));document.querySelector('[data-act="toggle"]')?.addEventListener('click',()=>{innerWidth<=900?state.mobile=!state.mobile:state.collapsed=!state.collapsed;render()});document.querySelector('[data-act="drop"]')?.addEventListener('click',e=>{e.stopPropagation();state.drop=!state.drop;render()});document.querySelector('[data-act="password"]')?.addEventListener('click',()=>formModal('修改密码',['原密码','新密码','确认新密码']));document.querySelector('[data-act="bind"]')?.addEventListener('click',()=>formModal('绑定警员',['警员姓名','警号','所属组织']));document.querySelector('[data-act="logout"]')?.addEventListener('click',()=>confirmModal('退出','确定退出当前后台管理系统？',()=>{state.login=false;state.route='/login';render()}))}
    function bindPage(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tabs[state.route]=b.dataset.tab;render()});document.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{state.tree=b.dataset.tree;toast('已选择：'+state.tree);render()});document.querySelectorAll('[data-classify]').forEach(b=>b.onclick=()=>{state.globalClassify=b.dataset.classify;render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='reset'){document.querySelectorAll('.filters input').forEach(i=>i.value='');if(state.route==='/baseData/globals')state.globalClassify='__ALL__'}toast(b.dataset.page==='reset'?'已重置查询条件':b.dataset.page==='search'?'查询成功':'分页切换成功')});document.querySelectorAll('[data-row-action]').forEach(b=>b.onclick=()=>rowAction(b.dataset.rowAction,b.dataset.row))}
    function rowAction(a,row){if(a.includes('删除')||['拒绝','取消授权','解绑'].includes(a)){confirmModal(a,`确定执行“${a}”操作？`,()=>toast(a+'成功'));return}if(['详情','查看','数据同步','重试'].includes(a)){drawer(a,row);return}if(['配置权限','绑定角色','绑定用户','关联人员','映射字段','关联任务标准件','Grant配置','配置','授权','批量授权','绑定'].includes(a)){formModal(a,['名称','授权范围','备注']);return}if(a==='下载'){toast('下载任务已创建');return}formModal(a,fields(a))}
    function fields(a){if(a.includes('密码'))return['原密码','新密码','确认新密码'];if(a.includes('组织'))return['组织名称','父组织','排序'];if(a.includes('底图'))return['地图名称','地图类型','地图文件'];if(a.includes('排班'))return['协同岗名称','人员姓名','排班类型','日期范围'];if(a.includes('上传'))return['文件名称','文件类型','上传文件'];return['名称','编码','状态','备注']}
    function formModal(title,fields){const root=document.getElementById('modal-root');root.innerHTML=`<div class="mask"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="mh"><span>${title}</span><button class="close" data-close>×</button></div><div class="mb"><div class="fg">${fields.map(l=>`<label>${l}</label>${l.includes('备注')?`<textarea class="el-textarea" placeholder="请输入${l}"></textarea>`:`<input class="el-input" placeholder="请输入${l}" ${l.includes('密码')?'type="password"':''}>`}`).join('')}</div></div><div class="mf"><button class="el-btn" data-close>取消</button> <button class="el-btn primary" data-submit>确定</button></div></section></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('[data-submit]').onclick=()=>{closeModal();toast(title+'成功')};root.querySelector('input,textarea')?.focus()}
    function confirmModal(title,msg,ok){const root=document.getElementById('modal-root');root.innerHTML=`<div class="mask"><section class="modal" style="width:min(420px,100%)" role="dialog" aria-modal="true" aria-label="${title}"><div class="mh"><span>${title}</span><button class="close" data-close>×</button></div><div class="mb">${msg}</div><div class="mf"><button class="el-btn" data-close>取消</button> <button class="el-btn primary" data-ok>确定</button></div></section></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('[data-ok]').onclick=()=>{closeModal();ok()}}
    function drawer(title,row){const root=document.getElementById('modal-root');root.innerHTML=`<div class="drawer-mask"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="mh"><span>${title}</span><button class="close" data-close>×</button></div><div class="mb"><div class="desc"><div class="dl">数据序号</div><div>${Number(row||0)+1}</div><div class="dl">当前路由</div><div>${state.route}</div><div class="dl">连接状态</div><div><span class="tag ok">正常</span></div><div class="dl">操作说明</div><div>模拟真实项目中的详情、配置、授权、同步等抽屉/弹窗交互。</div></div></div><div class="mf"><button class="el-btn primary" data-close>关闭</button></div></aside></div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
    function closeModal(){document.getElementById('modal-root').innerHTML=''}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),1600)}
    function loginHtml(){return`<div class="login"><div class="tool"><select class="el-select"><option>中文</option><option>English</option></select></div><form class="login-form"><div class="login-title"><h3>${systemTitle}移动指挥后台管理系统</h3><img src="${logo}" alt="警务协同"></div><label class="login-field"><span>用户</span><input id="u" autocomplete="username" placeholder="请输入用户名" value="admin"></label><label class="login-field"><span>密码</span><input id="p" type="password" autocomplete="current-password" placeholder="请输入密码" value="admin123"></label><button class="el-btn primary" style="width:100%;height:40px" type="submit">登录</button></form></div>`}
    function bindLogin(){document.querySelector('.login-form').onsubmit=e=>{e.preventDefault();if(!document.getElementById('u').value||!document.getElementById('p').value){toast('用户名或密码不能为空');return}state.login=true;state.route='/dashboard';location.hash='/dashboard';render()}}
    function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
    render();
  </script>
</body>
</html>
